# oc apply -f deploy/configmap.yaml && oc set env deploy/avida-cfo --from=configmap/avida-cfo-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: avida-cfo-config
data:
  # Internal URL of the vLLM InferenceService (check: oc get inferenceservice, oc get svc)
  # Pattern: http://<isvc-name>-predictor.<model-namespace>.svc.cluster.local:8080/v1
  LLM_BASE_URL: "http://granite-8b-predictor.avida-models.svc.cluster.local:8080/v1"
  # Must match the served model name (curl $LLM_BASE_URL/models)
  LLM_MODEL: "granite-8b"
  LLM_TIMEOUT_S: "60"
  LLM_ENABLED: "true"
  DEMO_FALLBACK: "true"
  FORECAST_DAYS: "90"
  DEMO_TODAY: "2026-11-20"
  TRACE_DELAY_S: "0.4"
  # MLflow tracing of the agents (deploy/mlflow.yaml). Remove the line to switch tracing off;
  # if MLflow is down the app keeps working, it just stops sending traces.
  MLFLOW_TRACKING_URI: "http://mlflow.avida-cfo.svc.cluster.local:5000"
  MLFLOW_EXPERIMENT_NAME: "avida-cfo-agents"
