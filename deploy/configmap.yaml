# oc apply -f deploy/configmap.yaml && oc set env deploy/avida-cfo --from=configmap/avida-cfo-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: avida-cfo-config
data:
  # Primary: Granite served by llm-d (deploy/model/granite-llmd.yaml), through our private inference
  # Gateway (cluster-internal only). Check: oc get llmisvc granite-llmd -n avida-models -o jsonpath='{.status.url}'
  LLM_BASE_URL: "http://avida-inference-openshift-ai-inference.openshift-ingress.svc.cluster.local/avida-models/granite-llmd/v1"
  # Must match the served model name (curl $LLM_BASE_URL/models)
  LLM_MODEL: "granite-8b"
  # Fallback: the plain vLLM InferenceService (deploy/model/granite-8b.yaml). Used automatically when llm-d
  # is down; only one GPU, so start it with: oc annotate isvc granite-8b -n avida-models serving.kserve.io/stop=false --overwrite
  # Remove these two lines to switch failover off.
  LLM_FALLBACK_BASE_URL: "http://granite-8b-predictor.avida-models.svc.cluster.local:8080/v1"
  LLM_FALLBACK_MODEL: "granite-8b"
  LLM_TIMEOUT_S: "60"
  # all endpoints down / timing out → canned answers for this many seconds instead of waiting per call
  LLM_BREAKER_S: "45"
  LLM_ENABLED: "true"
  DEMO_FALLBACK: "true"
  FORECAST_DAYS: "90"
  DEMO_TODAY: "2026-11-20"
  TRACE_DELAY_S: "0.4"
  # MLflow tracing of the agents (deploy/mlflow.yaml). Remove the line to switch tracing off;
  # if MLflow is down the app keeps working, it just stops sending traces.
  MLFLOW_TRACKING_URI: "http://mlflow.avida-cfo.svc.cluster.local:5000"
  MLFLOW_EXPERIMENT_NAME: "avida-cfo-agents"
