# Granite 3.3 8B Instruct served with llm-d (Distributed Inference, OpenShift AI 3.5) – bonus "Use llm-d".
# Same model and vLLM flags as granite-8b.yaml, but behind the llm-d inference gateway + scheduler
# (Gateway API HTTPRoute -> llm-d EPP scheduler -> vLLM pod), instead of a plain KServe predictor.
#
# Private gateway: the shared "openshift-ai-inference" Gateway has a public AWS load balancer, no auth
# (no Kuadrant/Connectivity Link on this cluster) and does not accept routes from avida-models anyway.
# So we add our own Gateway of the same class, as a ClusterIP service: reachable only inside the cluster.
#
# Only ONE GPU on the cluster: stop the plain InferenceService first, otherwise the vLLM pod stays Pending.
#   oc apply -f deploy/model/granite-llmd.yaml
#   oc annotate isvc granite-8b -n avida-models serving.kserve.io/stop=true --overwrite
#   oc -n avida-models get llmisvc granite-llmd -w                     # first start ~15 min (image pull)
#   oc -n avida-models get llmisvc granite-llmd -o jsonpath='{.status.url}'
#
# App endpoint (cluster-internal, plain HTTP, model name granite-8b):
#   http://avida-inference-openshift-ai-inference.openshift-ingress.svc.cluster.local/avida-models/granite-llmd/v1
#
# Back to the old setup (the app fails over by itself, see LLM_FALLBACK_BASE_URL in configmap.yaml):
#   oc delete -f deploy/model/granite-llmd.yaml
#   oc annotate isvc granite-8b -n avida-models serving.kserve.io/stop=false --overwrite
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: avida-inference
  namespace: openshift-ingress       # the OpenShift gateway controller only manages Gateways here
  annotations:
    networking.istio.io/service-type: ClusterIP   # no public load balancer
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: avida-models
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: granite-llmd
  namespace: avida-models
  annotations:
    openshift.io/display-name: granite-llmd
    security.opendatahub.io/enable-auth: "false"   # cluster-internal only, like granite-8b
  labels:
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  model:
    uri: oci://quay.io/redhat-ai-services/modelcar-catalog:granite-3.3-8b-instruct
    name: granite-8b          # served model name = LLM_MODEL, same as the plain InferenceService
  router:
    route: {}                 # HTTPRoute on the llm-d inference Gateway
    gateway:                  # our private Gateway above, not the public shared one
      refs:
        - name: avida-inference
          namespace: openshift-ingress
    scheduler: {}             # llm-d endpoint picker (prefix-cache / KV-cache aware routing)
  template:
    containers:
      - name: main
        args:                 # merged with the defaults generated by OpenShift AI
          - --dtype=bfloat16
          - --quantization=fp8
          - --max-model-len=16384
          - --gpu-memory-utilization=0.92
          - --enable-auto-tool-choice
          - --tool-call-parser=granite
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "6"
            memory: 24Gi
            nvidia.com/gpu: "1"
